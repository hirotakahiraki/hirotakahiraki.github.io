{% include base_path %}
{% assign lang = page.lang | default: 'en' %}
<div class="masthead"><div class="masthead__inner-wrap"><div class="masthead__menu">
  <a class="site-title" href="{% if lang == 'ja' %}{{ '/ja/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">Hirotaka Hiraki</a>
  <nav id="site-nav" class="site-navigation" aria-label="{% if lang == 'ja' %}メインメニュー{% else %}Main navigation{% endif %}">
    <button class="navigation-toggle" type="button" aria-controls="navigation-links" aria-expanded="false" aria-label="{% if lang == 'ja' %}メニュー{% else %}Navigation menu{% endif %}"><span class="navigation-icon" aria-hidden="true"></span></button>
    <ul id="navigation-links" class="navigation-links">
      {% for link in site.data.navigation[lang] %}<li class="masthead__menu-item {% if page.url == link.url %}selected{% endif %}"><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>{% endfor %}
    </ul>
  </nav>
  {% if page.translation_en %}<nav class="language-navigation" aria-label="{% if lang == 'ja' %}言語切り替え{% else %}Language{% endif %}"><div class="language-switch"><a href="{{ page.translation_en | relative_url }}" lang="en" hreflang="en"{% if lang == 'en' %} aria-current="page"{% endif %}>EN</a><span aria-hidden="true">/</span><a href="{{ page.translation_ja | relative_url }}" lang="ja" hreflang="ja"{% if lang == 'ja' %} aria-current="page"{% endif %}>日本語</a></div></nav>{% endif %}
</div></div></div>
