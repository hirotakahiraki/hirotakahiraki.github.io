<p class="project-summary">{{ page.summary }}</p><div class="project-resource-links">{% for link in page.links %}<a class="btn btn--inverse" href="{{ link.url }}">{{ link.name }} <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>{% endfor %}</div><figure class="project-figure"><img src="{{ page.image | relative_url }}" alt="{{ page.title }} — {{ page.summary }}" width="1400" height="788">{% if page.title == 'YU-RA' %}<figcaption>Photo by <a href="https://yamadasanami.myportfolio.com/work">Sanami Yamada</a></figcaption>{% endif %}</figure>
