<p class="project-summary">{{ page.summary }}</p><div class="project-resource-links">{% for link in page.links %}<a class="btn btn--inverse" href="{{ link.url }}">{{ link.name }} <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>{% endfor %}</div><figure class="project-figure"><img src="{{ page.image | relative_url }}" alt="{% if page.image_alt %}{{ page.image_alt | escape }}{% else %}{{ page.title }} — {{ page.summary }}{% endif %}" width="{{ page.image_width | default: 1400 }}" height="{{ page.image_height | default: 788 }}">{% if page.title == 'YU-RA' %}<figcaption>Photo by <a href="https://yamadasanami.myportfolio.com/work">Sanami Yamada</a></figcaption>{% endif %}</figure>
